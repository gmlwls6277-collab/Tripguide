<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외일정 플래너</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1929;
    --surface2: #252438;
    --accent: #e8c547;
    --accent2: #ff6b6b;
    --accent3: #64dfdf;
    --text: #fffffe;
    --text-muted: #a7a9be;
    --border: rgba(255,255,255,0.08);
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    position: sticky; top:0; z-index:100;
    background: rgba(15,14,23,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo { font-family:'Playfair Display',serif; font-size:1.4rem; color:var(--accent); letter-spacing:-0.5px; }
  .logo span { font-style:italic; color:var(--text); }
  .tab-nav { display:flex; gap:4px; }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-family:'Noto Sans KR',sans-serif;
    font-size:.85rem; padding:6px 14px; border-radius:20px;
    transition: all .2s;
  }
  .tab-btn.active { background:var(--surface2); color:var(--text); }
  .tab-btn:hover:not(.active) { color:var(--text); }

  /* ── Layout ── */
  .app { max-width:1100px; margin:0 auto; padding:28px 24px; }
  .page { display:none; }
  .page.active { display:block; animation: fadeUp .4s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

  /* ── Trip Cards ── */
  .section-header {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
  }
  .section-title { font-size:1.3rem; font-weight:700; }
  .btn-primary {
    background:var(--accent); color:#000; border:none; cursor:pointer;
    padding:9px 20px; border-radius:24px; font-size:.85rem; font-weight:700;
    font-family:'Noto Sans KR',sans-serif; transition: transform .15s, box-shadow .15s;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(232,197,71,0.35); }
  .trips-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .trip-card {
    background:var(--surface); border-radius:var(--radius);
    border:1px solid var(--border); padding:22px;
    cursor:pointer; transition: transform .2s, border-color .2s;
    position:relative; overflow:hidden;
  }
  .trip-card:hover { transform:translateY(-4px); border-color:var(--accent); }
  .trip-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
  }
  .trip-emoji { font-size:2rem; margin-bottom:10px; }
  .trip-name { font-size:1.1rem; font-weight:700; margin-bottom:4px; }
  .trip-dates { font-size:.8rem; color:var(--text-muted); margin-bottom:14px; }
  .trip-progress-bar {
    background: rgba(255,255,255,0.08); border-radius:4px; height:6px; margin-bottom:6px;
  }
  .trip-progress-fill {
    height:100%; border-radius:4px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    transition: width .5s ease;
  }
  .trip-progress-label { font-size:.75rem; color:var(--text-muted); }
  .trip-actions { display:flex; gap:8px; margin-top:14px; }
  .btn-sm {
    flex:1; padding:7px; border-radius:8px; border:1px solid var(--border);
    background:none; color:var(--text-muted); cursor:pointer; font-size:.8rem;
    font-family:'Noto Sans KR',sans-serif; transition:all .15s;
  }
  .btn-sm:hover { background:var(--surface2); color:var(--text); }
  .btn-danger:hover { border-color:var(--accent2); color:var(--accent2); }
  .empty-state {
    text-align:center; padding:60px 20px; color:var(--text-muted);
  }
  .empty-state .icon { font-size:3.5rem; margin-bottom:12px; }
  .empty-state p { font-size:.95rem; }

  /* ── Trip Detail (Schedule + Checklist) ── */
  .detail-header {
    display:flex; align-items:center; gap:12px; margin-bottom:24px;
  }
  .back-btn {
    background:var(--surface2); border:none; color:var(--text);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1rem;
    display:flex; align-items:center; justify-content:center; transition:background .15s;
  }
  .back-btn:hover { background:var(--surface); }
  .detail-title { font-size:1.5rem; font-weight:700; }
  .detail-subtitle { font-size:.85rem; color:var(--text-muted); margin-top:2px; }

  /* tabs inside detail */
  .inner-tabs { display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:0; }
  .inner-tab {
    background:none; border:none; cursor:pointer; color:var(--text-muted);
    font-family:'Noto Sans KR',sans-serif; font-size:.9rem; padding:8px 16px;
    border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s;
  }
  .inner-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* Schedule — timeline design */
  .day-block { margin-bottom:32px; }
  .day-header {
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
    padding-bottom:12px; border-bottom:1px solid var(--border);
  }
  .day-badge {
    background:var(--accent); color:#000; font-weight:700; font-size:.72rem;
    padding:4px 12px; border-radius:20px; letter-spacing:.5px;
  }
  .day-date-label { font-size:.9rem; font-weight:500; }
  .day-weekday { font-size:.8rem; color:var(--text-muted); }
  .day-event-count { margin-left:auto; font-size:.75rem; color:var(--text-muted); background:var(--surface2); padding:3px 10px; border-radius:10px; }

  /* Day tabs */
  .day-tab-bar {
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:20px; padding-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .day-tab {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:8px 16px; cursor:pointer;
    transition:all .2s; min-width:72px; position:relative;
    font-family:'Noto Sans KR',sans-serif;
  }
  .day-tab:hover { border-color:var(--accent); }
  .day-tab.active {
    background:var(--accent); border-color:var(--accent);
  }
  .day-tab-num {
    font-size:.75rem; font-weight:700; color:var(--text-muted);
  }
  .day-tab.active .day-tab-num { color:#000; }
  .day-tab-date {
    font-size:.72rem; color:var(--text-muted);
  }
  .day-tab.active .day-tab-date { color:rgba(0,0,0,0.6); }
  .day-tab-count {
    position:absolute; top:-6px; right:-6px;
    background:var(--accent2); color:#fff; font-size:.6rem; font-weight:700;
    width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .day-tab.active .day-tab-count { background:#000; color:var(--accent); }

  /* Timeline */
  .timeline { position:relative; padding-left:20px; }
  .timeline::before {
    content:''; position:absolute; left:6px; top:0; bottom:0;
    width:1px; background: linear-gradient(to bottom, var(--accent), transparent);
  }
  .tl-item {
    position:relative; margin-bottom:6px;
  }
  .tl-dot {
    position:absolute; left:-17px; top:14px;
    width:9px; height:9px; border-radius:50%;
    border:2px solid var(--surface); flex-shrink:0;
  }
  .tl-dot.transport { background:#a78bfa; }
  .tl-dot.food      { background:#f97316; }
  .tl-dot.hotel     { background:#22d3ee; }
  .tl-dot.activity  { background:var(--accent); }
  .tl-dot.other     { background:var(--text-muted); }

  .tl-card {
    background:var(--surface); border-radius:12px;
    border:1px solid var(--border);
    overflow:hidden; transition:border-color .2s;
  }
  .tl-card:hover { border-color:rgba(255,255,255,0.15); }

  .tl-card-head {
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; cursor:pointer;
  }
  .tl-time {
    font-size:.78rem; font-weight:600; font-family:monospace;
    color:var(--text-muted); min-width:42px; flex-shrink:0;
  }
  .tl-type-badge {
    font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:8px;
    flex-shrink:0; letter-spacing:.3px;
  }
  .tl-type-badge.transport { background:rgba(167,139,250,.15); color:#a78bfa; }
  .tl-type-badge.food      { background:rgba(249,115,22,.15);  color:#f97316; }
  .tl-type-badge.hotel     { background:rgba(34,211,238,.15);  color:#22d3ee; }
  .tl-type-badge.activity  { background:rgba(232,197,71,.15);  color:var(--accent); }
  .tl-type-badge.other     { background:rgba(167,169,190,.15); color:var(--text-muted); }

  .tl-name { font-size:.9rem; font-weight:600; flex:1; }
  /* Event done / past state */
  .tl-card.done { opacity:0.45; }
  .tl-card.done .tl-name { text-decoration:line-through; color:var(--text-muted); }
  .tl-card.past-card { opacity:0.6; }
  .tl-past-badge {
    font-size:.65rem; font-weight:700; padding:2px 7px; border-radius:8px;
    background:rgba(167,169,190,.15); color:var(--text-muted);
    flex-shrink:0; margin-left:auto;
  }
  .tl-past-badge.done-badge { background:rgba(100,223,223,.15); color:var(--accent3); }
  .tl-arrow {
    font-size:.7rem; color:var(--text-muted); margin-left:4px; flex-shrink:0;
  }
  .tl-done-btn {
    width:22px; height:22px; border-radius:50%; border:2px solid var(--border);
    background:none; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s;
  }
  .tl-done-btn:hover { border-color:var(--accent3); }
  .tl-done-btn.checked { background:var(--accent3); border-color:var(--accent3); }
  .tl-done-btn.checked svg polyline { stroke:#000; }

  .tl-edit-btn {
    background:var(--surface2); border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; font-size:.72rem; padding:3px 9px; border-radius:7px;
    flex-shrink:0; transition:all .15s;
  }
  .tl-edit-btn:hover { border-color:var(--accent); color:var(--accent); }
  .tl-delete-btn {
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    font-size:.85rem; padding:3px 6px; transition:color .15s; flex-shrink:0;
  }
  .tl-delete-btn:hover { color:var(--accent2); }

  .tl-note-body {
    padding:0 14px 12px 14px;
    border-top:1px solid var(--border);
    display:flex; flex-direction:column; gap:5px; padding-top:10px;
  }
  .tl-note-line {
    display:flex; align-items:flex-start; gap:8px;
    font-size:.8rem; color:var(--text-muted); line-height:1.6;
  }
  .tl-note-line.hl { color:var(--accent3); }
  .tl-note-dot {
    width:5px; height:5px; border-radius:50%;
    background:var(--text-muted); flex-shrink:0; margin-top:6px;
  }
  .tl-note-line.hl .tl-note-dot { background:var(--accent3); }

  .add-event-form {
    background:var(--surface); border-radius:var(--radius); padding:18px;
    border:1px dashed var(--border); margin-top:8px;
  }
  .form-row { display:flex; gap:10px; flex-wrap:wrap; }
  .form-group { flex:1; min-width:120px; }
  .form-group label { display:block; font-size:.75rem; color:var(--text-muted); margin-bottom:4px; }
  .form-input, .form-select {
    width:100%; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; color:var(--text); font-size:.85rem;
    font-family:'Noto Sans KR',sans-serif; outline:none; transition:border-color .15s;
  }
  .form-input:focus, .form-select:focus { border-color:var(--accent); }
  .form-select option { background:var(--surface2); }
  .btn-add {
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    padding:8px 16px; border-radius:8px; cursor:pointer; font-size:.85rem;
    font-family:'Noto Sans KR',sans-serif; transition:all .15s; margin-top:10px;
  }
  .btn-add:hover { border-color:var(--accent); color:var(--accent); }

  /* Checklist */
  .checklist-cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .cat-chip {
    background:var(--surface2); border:1px solid var(--border); border-radius:16px;
    padding:5px 14px; font-size:.8rem; cursor:pointer; color:var(--text-muted);
    transition:all .15s;
  }
  .cat-chip.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }

  .checklist-section { margin-bottom:20px; }
  .checklist-section-title {
    font-size:.8rem; font-weight:700; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:10px;
  }
  .check-item {
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border-radius:10px; padding:12px 14px;
    margin-bottom:6px; transition:opacity .2s;
  }
  .check-item.done { opacity:.5; }
  .check-item.done .check-label { text-decoration:line-through; }
  .custom-check {
    width:20px; height:20px; border-radius:6px;
    border:2px solid var(--border); background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:all .15s;
  }
  .custom-check.checked { background:var(--accent); border-color:var(--accent); }
  .check-label { flex:1; font-size:.9rem; }
  .check-delete { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:.9rem; }
  .check-delete:hover { color:var(--accent2); }

  .add-check-row { display:flex; gap:8px; margin-top:10px; }
  .add-check-row .form-input { flex:1; }

  /* Modal */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.7);
    z-index:200; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal {
    background:var(--surface); border-radius:20px; padding:28px; width:min(480px,92vw);
    border:1px solid var(--border); transform:scale(.95); transition:transform .2s;
  }
  .modal-overlay.open .modal { transform:scale(1); }
  .modal-title { font-size:1.2rem; font-weight:700; margin-bottom:20px; }
  .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn-cancel {
    background:none; border:1px solid var(--border); color:var(--text-muted);
    padding:9px 20px; border-radius:24px; cursor:pointer; font-size:.85rem;
    font-family:'Noto Sans KR',sans-serif;
  }

  /* Stats */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:28px; }
  .stat-card {
    background:var(--surface); border-radius:var(--radius); padding:20px;
    border:1px solid var(--border);
  }
  .stat-label { font-size:.8rem; color:var(--text-muted); margin-bottom:6px; }
  .stat-value { font-size:1.8rem; font-weight:700; }
  .stat-value.accent { color:var(--accent); }
  .stat-value.accent3 { color:var(--accent3); }


  /* ── Passengers ── */
  .passengers-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-bottom:24px; }
  .passenger-card {
    background:var(--surface); border-radius:var(--radius); border:1px solid var(--border);
    overflow:hidden; transition:border-color .2s, transform .2s; position:relative;
  }
  .passenger-card:hover { border-color:var(--accent3); transform:translateY(-3px); }
  .passenger-card-header {
    background: linear-gradient(135deg, #1a1a35, #0f2340);
    padding:18px 20px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px;
  }
  .passenger-avatar {
    width:46px; height:46px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent3), #a78bfa);
    display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; font-weight:700; color:#000; flex-shrink:0;
  }
  .passenger-name-en { font-size:1rem; font-weight:700; letter-spacing:.5px; font-family:monospace; }
  .passenger-name-ko { font-size:.8rem; color:var(--text-muted); margin-top:2px; }
  .passenger-card-body { padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
  .passenger-field { display:flex; align-items:center; gap:10px; }
  .pf-icon { font-size:.95rem; width:20px; text-align:center; flex-shrink:0; }
  .pf-label { font-size:.72rem; color:var(--text-muted); margin-bottom:1px; }
  .pf-value { font-size:.88rem; font-weight:500; }
  .pf-value.mono { font-family:monospace; letter-spacing:1.5px; color:var(--accent3); font-size:.9rem; }
  .pf-value.passport { font-family:monospace; letter-spacing:2px; color:var(--accent); font-size:.9rem; }
  .pf-value.no-ffn { color:var(--text-muted); font-style:italic; font-size:.82rem; }
  .passenger-card-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:8px; }
  .pax-count-badge {
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface2); border-radius:12px; padding:5px 14px;
    font-size:.8rem; color:var(--text-muted); margin-bottom:16px;
  }
  .pax-count-badge strong { color:var(--accent3); }


  /* ── Budget ── */
  .budget-section { margin-bottom:28px; }
  .budget-section-title {
    font-size:.78rem; font-weight:700; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .budget-section-title::after {
    content:''; flex:1; height:1px; background:var(--border);
  }
  .budget-table { width:100%; border-collapse:collapse; }
  .budget-table th {
    font-size:.72rem; color:var(--text-muted); text-align:left;
    padding:6px 10px; border-bottom:1px solid var(--border); font-weight:500;
  }
  .budget-table th:last-child, .budget-table td:last-child { text-align:right; }
  .budget-table th:nth-child(3), .budget-table td:nth-child(3) { text-align:right; }
  .budget-table td {
    font-size:.83rem; padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.04);
    vertical-align:top;
  }
  .budget-table tr:hover td { background:rgba(255,255,255,0.02); }
  .budget-table td:first-child { font-weight:500; white-space:nowrap; }
  .budget-table td.note { color:var(--text-muted); font-size:.76rem; }
  .budget-table td.won { color:var(--accent3); font-family:monospace; white-space:nowrap; }
  .budget-table td.qty { color:var(--text-muted); text-align:right; }
  .budget-subtotal td {
    background:var(--surface2); font-weight:700; font-size:.82rem;
    border-top:1px solid var(--border);
  }
  .budget-subtotal td.won { color:var(--accent); }
  .budget-grand {
    background: linear-gradient(135deg,var(--surface),var(--surface2));
    border-radius:var(--radius); padding:20px 24px; margin-top:8px;
    display:flex; justify-content:space-between; align-items:center;
    border:1px solid var(--border);
  }
  .budget-grand-label { font-size:.9rem; color:var(--text-muted); }
  .budget-grand-amount { font-size:1.6rem; font-weight:700; color:var(--accent); font-family:monospace; }
  .budget-grand-krw { font-size:.85rem; color:var(--text-muted); margin-top:2px; text-align:right; }
  .budget-tag {
    display:inline-block; font-size:.7rem; padding:2px 7px; border-radius:10px;
    margin-left:6px; font-weight:600;
  }
  .tag-pharmacy { background:rgba(100,223,223,0.15); color:var(--accent3); }
  .tag-market   { background:rgba(232,197,71,0.15);  color:var(--accent); }
  .tag-food     { background:rgba(249,115,22,0.15);  color:#f97316; }
  .tag-massage  { background:rgba(167,139,250,0.15); color:#a78bfa; }
  .tag-gift     { background:rgba(255,107,107,0.15); color:var(--accent2); }
  .tag-transport{ background:rgba(34,211,238,0.15);  color:#22d3ee; }

  /* Responsive */
  @media(max-width:600px){
    .trips-grid { grid-template-columns:1fr; }
    .form-row { flex-direction:column; }
    .tab-btn { padding:6px 10px; font-size:.78rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Trip<span>Guide</span></div>
  <nav class="tab-nav">
    <button class="tab-btn active" onclick="showPage('trips')">✈ 여행 목록</button>
    <button class="tab-btn" onclick="showPage('detail')" id="detail-tab" style="display:none">📋 상세</button>
  </nav>

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

    document.querySelector('.tab-btn').classList.add('active');
    document.getElementById('detail-tab').style.display='none';
    renderTrips();

// ── Trips ──
function renderTrips(){
  const grid = document.getElementById('trips-grid');
  if(!trips.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="icon">🌍</div><p>아직 여행이 없어요.<br>첫 번째 해외 여행을 추가해보세요!</p></div>`;
    return;
  }
  grid.innerHTML = trips.map(t=>{
    const total = Object.values(t.checklist||{}).flat().length;
    const done = Object.values(t.checklist||{}).flat().filter(i=>i.done).length;
    const pct = total ? Math.round(done/total*100) : 0;
    const nights = t.start && t.end ? Math.max(0,Math.round((new Date(t.end)-new Date(t.start))/86400000)) : '?';
    return `<div class="trip-card" onclick="openTrip('${t.id}')">
      <div class="trip-emoji">${t.emoji||'✈️'}</div>
      <div class="trip-name">${t.name}</div>
      <div class="trip-dates">${t.start||'?'} ~ ${t.end||'?'} (${nights}박)</div>
      <div class="trip-progress-bar"><div class="trip-progress-fill" style="width:${pct}%"></div></div>
      <div class="trip-progress-label">체크리스트 ${done}/${total} (${pct}%)</div>
      <div class="trip-actions">
        <button class="btn-sm" onclick="event.stopPropagation();openTrip('${t.id}')">열기</button>
        <button class="btn-sm btn-danger" onclick="event.stopPropagation();deleteTrip('${t.id}')">삭제</button>
      </div>
    </div>`;
  }).join('');
}

function renderDetail(){

// ── Schedule ──
function renderSchedule(){
  const t = getTrip(); if(!t) return;
  const container = document.getElementById('schedule-days');
  const days = buildDays(t);
  if(!days.length){
    container.innerHTML='<div class="empty-state"><div class="icon">📅</div><p>출발일·귀국일을 설정하면<br>날짜별 일정이 나타납니다.</p></div>';
    return;
  }
  const typeLabel = {transport:'교통',food:'식사',hotel:'숙소',activity:'관광',other:'기타'};
  const dow = ['일','월','화','수','목','금','토'];
  const activeDay = window._schedActiveDay || days[0];

  // Day tab bar
  let tabHtml = '<div class="day-tab-bar">';
  days.forEach((d,i)=>{
    const dateObj = new Date(d);
    const evCount = (t.schedule[d]||[]).length;
    const isActive = d === activeDay;
    tabHtml += '<button class="day-tab'+(isActive?' active':'')+'" onclick="setScheduleDay(\''+d+'\')">'+
      '<span class="day-tab-num">Day '+(i+1)+'</span>'+
      '<span class="day-tab-date">'+dow[dateObj.getDay()]+'</span>'+
      (evCount ? '<span class="day-tab-count">'+evCount+'</span>' : '')+
      '</button>';
  });
  tabHtml += '</div>';

  // Active day content
  const d = activeDay;
  const dateObj = new Date(d);
  const events = (t.schedule[d]||[]).sort((a,b)=>a.time.localeCompare(b.time));

  let dayHtml = '<div class="day-block">'
    + '<div class="day-header">'
    + '<span class="day-badge">'+d+'</span>'
    + '<span class="day-weekday">'+dow[dateObj.getDay()]+'요일</span>'
    + '<button class="btn-add" style="margin:0;padding:4px 12px;font-size:.75rem;margin-left:auto" onclick="showAddEvent(\''+d+'\')">+ 일정 추가</button>'
    + '</div>'
    + '<div class="timeline">'
    + (events.length ? events.map(ev=>{
        const noteChips = ev.note ? ev.note.split('·').map(c=>c.trim()).filter(Boolean) : [];
        const hasNote = noteChips.length > 0;
        return '<div class="tl-item">'
          + '<div class="tl-dot '+ev.type+'"></div>'
          + '<div class="tl-card'+(ev.done?' done':'')+'">'
          + '<div class="tl-card-head">'
          + '<span class="tl-time">'+(ev.time||'--:--')+'</span>'
          + '<span class="tl-type-badge '+ev.type+'">'+typeLabel[ev.type||'other']+'</span>'
          + '<span class="tl-name">'+ev.name+'</span>'
          + '<button class="tl-edit-btn" onclick="openEditEvent(\''+d+'\',\''+ev.id+'\')">수정</button>'
          + '<button class="tl-delete-btn" onclick="deleteEvent(\''+d+'\',\''+ev.id+'\')">✕</button>'
          + '</div>'
          + (hasNote
              ? '<div class="tl-note-body">'
                + noteChips.map(c=>{
                    const isHighlight = c.startsWith('✅') || c.includes('무료') || c.includes('예약') || c.includes('완료');
                    return '<div class="tl-note-line'+(isHighlight?' hl':'')+'"><span class="tl-note-dot"></span>'+c+'</div>';
                  }).join('')
                + '</div>'
              : '')
          + '</div></div>';
      }).join('')
      : '<div style="padding:32px 0;color:var(--text-muted);font-size:.85rem;text-align:center">이 날 일정이 없어요</div>')
    + '</div>'

    + '<div class="add-event-form" id="add-form-'+d+'" style="display:none;margin-top:12px">'
    + '<div class="form-row">'
    + '<div class="form-group"><label>시간</label><input class="form-input" type="time" id="ef-time-'+d+'" value="09:00"></div>'
    + '<div class="form-group"><label>종류</label>'
    + '<select class="form-select" id="ef-type-'+d+'">'
    + '<option value="activity">관광</option><option value="food">식사</option>'
    + '<option value="transport">교통</option><option value="hotel">숙소</option><option value="other">기타</option>'
    + '</select></div></div>'
    + '<div class="form-row" style="margin-top:8px">'
    + '<div class="form-group"><label>일정 이름 *</label><input class="form-input" id="ef-name-'+d+'" placeholder="예: 한시장 마사지"></div>'
    + '<div class="form-group"><label>메모 (· 로 구분)</label><input class="form-input" id="ef-note-'+d+'" placeholder="예: 예약번호 123 · 무료"></div>'
    + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:8px">'
    + '<button class="btn-add" onclick="addEvent(\''+d+'\')">저장</button>'
    + '<button class="btn-cancel" style="padding:8px 14px;border-radius:8px;cursor:pointer" onclick="document.getElementById(\'add-form-'+d+'\').style.display=\'none\'">취소</button>'
    + '</div></div>'
    + '</div>';

  container.innerHTML = tabHtml + dayHtml;
}

function setScheduleDay(d){
  window._schedActiveDay = d;
  renderSchedule();
}

function buildDays(t){
  if(!t.start||!t.end) return [];
  const days=[]; let cur=new Date(t.start);
  const end=new Date(t.end);
  while(cur<=end){ days.push(cur.toISOString().slice(0,10)); cur.setDate(cur.getDate()+1); }
  return days;
}
function showAddEvent(d){ document.getElementById('add-form-'+d).style.display='block'; }
function addEvent(d){
  const t=getTrip();
  const name=document.getElementById('ef-name-'+d).value.trim();
  if(!name){alert('일정 이름을 입력해주세요.');return;}
  if(!t.schedule[d]) t.schedule[d]=[];
  t.schedule[d].push({
    id:Math.random().toString(36).slice(2),
    time:document.getElementById('ef-time-'+d).value,
    type:document.getElementById('ef-type-'+d).value,
    name,
    note:document.getElementById('ef-note-'+d).value.trim(),
  });
  save(); renderSchedule();
}
function deleteEvent(d,id){
  const t=getTrip();
  t.schedule[d]=(t.schedule[d]||[]).filter(e=>e.id!==id);
  save(); renderSchedule();
}
function toggleEventDone(d,id){
  const t=getTrip();
  const ev=(t.schedule[d]||[]).find(e=>e.id===id);
  if(ev) ev.done=!ev.done;
  save(); renderSchedule();
}
function openEditEvent(d, id){
  const t = getTrip();
  const ev = (t.schedule[d]||[]).find(e=>e.id===id);
  if(!ev) return;
  document.getElementById('ee-day').value = d;
  document.getElementById('ee-id').value = id;
  document.getElementById('ee-time').value = ev.time||'';
  document.getElementById('ee-type').value = ev.type||'activity';
  document.getElementById('ee-name').value = ev.name||'';
  document.getElementById('ee-note').value = (ev.note||'').split('·').map(s=>s.trim()).join('\n· ');
  document.getElementById('modal-edit-event').classList.add('open');
}
function closeEditEventModal(){
  document.getElementById('modal-edit-event').classList.remove('open');
}
function saveEditEvent(){
  const t = getTrip();
  const d = document.getElementById('ee-day').value;
  const id = document.getElementById('ee-id').value;
  const ev = (t.schedule[d]||[]).find(e=>e.id===id);
  if(!ev) return;
  ev.time = document.getElementById('ee-time').value;
  ev.type = document.getElementById('ee-type').value;
  ev.name = document.getElementById('ee-name').value.trim();
  // note: join lines with ·
  ev.note = document.getElementById('ee-note').value.split('\n').map(function(s){ return s.replace(/^[· ]+/,'').trim(); }).filter(Boolean).join(' · ');
  save();
  closeEditEventModal();
  renderSchedule();
}
function toggleCollapse(id){
  if(!window._expandedEvents) window._expandedEvents = {};
  window._expandedEvents[id] = !window._expandedEvents[id];
  renderSchedule();
}

// ── Checklist ──
function renderChecklist(){
  const t=getTrip(); if(!t) return;
  const cats=['전체',...Object.keys(t.checklist)];
  document.getElementById('checklist-cats').innerHTML=cats.map(c=>
    `<span class="cat-chip${c===currentCheckCat?' active':''}" onclick="setCheckCat('${c}')">${c}</span>`
  ).join('');
  const body=document.getElementById('checklist-body');
  const showCats = currentCheckCat==='전체' ? Object.keys(t.checklist) : [currentCheckCat];
  body.innerHTML=showCats.map(cat=>{
    const items=t.checklist[cat]||[];
    return `<div class="checklist-section">
      <div class="checklist-section-title">${cat}</div>
      ${items.map(item=>`
        <div class="check-item${item.done?' done':''}">
          <div class="custom-check${item.done?' checked':''}" onclick="toggleCheck('${cat}','${item.id}')">
            ${item.done?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#000" stroke-width="2" fill="none"/></svg>':''}
          </div>
          <span class="check-label">${item.text}</span>
          <button class="check-delete" onclick="deleteCheck('${cat}','${item.id}')">✕</button>
        </div>`).join('')}
    </div>`;
  }).join('');
}
function setCheckCat(c){ currentCheckCat=c; renderChecklist(); }
function toggleCheck(cat,id){
  const t=getTrip();
  const item=t.checklist[cat].find(i=>i.id===id);
  if(item) item.done=!item.done;
  save(); renderChecklist(); renderDetail();  // update stats
}
function deleteCheck(cat,id){
  const t=getTrip();
  t.checklist[cat]=t.checklist[cat].filter(i=>i.id!==id);
  save(); renderChecklist();
}
function addCheckItem(){
  const t=getTrip();
  const input=document.getElementById('new-check-input');
  const text=input.value.trim(); if(!text) return;
  const cat=currentCheckCat==='전체'?Object.keys(t.checklist)[0]:currentCheckCat;
  if(!t.checklist[cat]) t.checklist[cat]=[];
  t.checklist[cat].push({id:Math.random().toString(36).slice(2),text,done:false});
  input.value=''; save(); renderChecklist();
}

}

function renderBudget(){
  const body = document.getElementById('budget-body');
  let grandVnd = 0, grandKrw = 0;
  BUDGET_DATA.forEach(s=>{
    s.items.forEach(it=>{ grandVnd += it.qty*it.uvnd; grandKrw += it.qty*it.ukrw; });
  });

  let html = '';

  // 상단 총합
  html += '<div class="budget-grand" style="margin-bottom:24px">'
        + '<div><div class="budget-grand-label">💳 총 예상 지출</div>'
        + '<div class="budget-grand-krw">'+grandVnd.toLocaleString()+' VND</div></div>'
        + '<div style="text-align:right"><div class="budget-grand-amount">₩'+grandKrw.toLocaleString()+'</div></div>'
        + '</div>';

  // 카테고리별 테이블
  BUDGET_DATA.forEach(function(sec){
    const secKrw = sec.items.reduce(function(a,it){ return a + it.qty*it.ukrw; }, 0);
    html += '<div class="budget-section">'
          + '<div class="budget-section-title">'+sec.icon+' '+sec.cat
          + ' <span class="budget-tag '+sec.tag+'">'+sec.tag.replace('tag-','')+'</span></div>'
          + '<table class="budget-table">'
          + '<thead><tr><th>항목</th><th>설명</th><th>수량</th><th>단가(₩)</th><th>합계(₩)</th></tr></thead>'
          + '<tbody>';
    sec.items.forEach(function(it){
      html += '<tr>'
            + '<td>'+it.name+'</td>'
            + '<td class="note">'+(it.note||'—')+'</td>'
            + '<td class="qty">'+it.qty+'</td>'
            + '<td class="won">'+(it.ukrw ? '₩'+it.ukrw.toLocaleString() : '—')+'</td>'
            + '<td class="won" style="font-weight:600">'+(it.ukrw ? '₩'+(it.qty*it.ukrw).toLocaleString() : '—')+'</td>'
            + '</tr>';
    });
    html += '<tr class="budget-subtotal">'
          + '<td colspan="4">소계'+(sec.note ? ' <span style="font-weight:400;color:var(--text-muted);font-size:.75rem">('+sec.note+')</span>' : '')+'</td>'
          + '<td class="won">₩'+secKrw.toLocaleString()+'</td>'
          + '</tr></tbody></table></div>';
  });

  // 하단 총합
  html += '<div class="budget-grand" style="margin-top:8px">'
        + '<div><div class="budget-grand-label">💳 총 예상 지출 합계</div>'
        + '<div class="budget-grand-krw">'+grandVnd.toLocaleString()+' VND</div></div>'
        + '<div style="text-align:right"><div class="budget-grand-amount">₩'+grandKrw.toLocaleString()+'</div></div>'
        + '</div>';


  body.innerHTML = html;
}
