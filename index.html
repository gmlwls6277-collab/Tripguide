<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripGuide — 다낭 가족여행</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e17;--sf:#1a1929;--sf2:#252438;--ac:#e8c547;--ac2:#ff6b6b;--ac3:#64dfdf;--tx:#fffffe;--mu:#a7a9be;--bd:rgba(255,255,255,0.08);--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{position:sticky;top:0;z-index:100;background:rgba(15,14,23,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--ac)}.logo span{font-style:italic;color:var(--tx)}
.app{max-width:900px;margin:0 auto;padding:24px 16px}
.tnav{display:flex;gap:4px}
.tbtn{background:none;border:none;cursor:pointer;color:var(--mu);font-family:'Noto Sans KR',sans-serif;font-size:.82rem;padding:6px 12px;border-radius:20px;transition:all .15s}
.tbtn.active{background:var(--sf2);color:var(--tx)}
.page{display:none}.page.active{display:block;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.itabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--bd);overflow-x:auto}
.itab{background:none;border:none;cursor:pointer;color:var(--mu);font-family:'Noto Sans KR',sans-serif;font-size:.84rem;padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.itab.active{color:var(--ac);border-bottom-color:var(--ac)}
.tc{background:var(--sf);border-radius:var(--r);border:1px solid var(--bd);padding:20px;position:relative;overflow:hidden;cursor:pointer}
.tc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--ac3))}
.tc-em{font-size:2rem;margin-bottom:8px}.tc-nm{font-size:1.2rem;font-weight:700;margin-bottom:4px}
.tc-dt{font-size:.82rem;color:var(--mu);margin-bottom:14px}
.prog{background:rgba(255,255,255,.08);border-radius:4px;height:5px;margin-bottom:5px}
.prog-f{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--ac3))}
.prog-l{font-size:.73rem;color:var(--mu)}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sc{background:var(--sf);border-radius:var(--r);padding:16px;border:1px solid var(--bd)}
.sc-l{font-size:.75rem;color:var(--mu);margin-bottom:4px}.sc-v{font-size:1.6rem;font-weight:700}
.sc-v.a{color:var(--ac)}.sc-v.b{color:var(--ac3)}.sc-v.c{color:#a78bfa}
.dtbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.dt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;transition:all .2s;min-width:66px;position:relative;font-family:'Noto Sans KR',sans-serif}
.dt:hover{border-color:var(--ac)}.dt.active{background:var(--ac);border-color:var(--ac)}
.dt-n{font-size:.7rem;font-weight:700;color:var(--mu)}.dt.active .dt-n{color:#000}
.dt-d{font-size:.68rem;color:var(--mu)}.dt.active .dt-d{color:rgba(0,0,0,.6)}
.dt-c{position:absolute;top:-5px;right:-5px;background:var(--ac2);color:#fff;font-size:.56rem;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.dbadge{background:var(--ac);color:#000;font-weight:700;font-size:.7rem;padding:3px 10px;border-radius:16px}
.ddow{font-size:.78rem;color:var(--mu)}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--ac),transparent)}
.tli{position:relative;margin-bottom:6px}
.tldot{position:absolute;left:-15px;top:14px;width:8px;height:8px;border-radius:50%;border:2px solid var(--sf)}
.tldot.transport{background:#a78bfa}.tldot.food{background:#f97316}.tldot.hotel{background:#22d3ee}.tldot.activity{background:var(--ac)}.tldot.other{background:var(--mu)}
.tlc{background:var(--sf);border-radius:10px;border:1px solid var(--bd);overflow:hidden}
.tlc.done{opacity:.45}.tlc.done .tlnm{text-decoration:line-through;color:var(--mu)}.tlc.past{opacity:.6}
.tlch{display:flex;align-items:center;gap:8px;padding:10px 12px}
.tltime{font-size:.75rem;font-weight:600;font-family:monospace;color:var(--mu);min-width:40px;flex-shrink:0}
.tlbadge{font-size:.63rem;font-weight:700;padding:2px 6px;border-radius:6px;flex-shrink:0}
.tlbadge.transport{background:rgba(167,139,250,.15);color:#a78bfa}.tlbadge.food{background:rgba(249,115,22,.15);color:#f97316}
.tlbadge.hotel{background:rgba(34,211,238,.15);color:#22d3ee}.tlbadge.activity{background:rgba(232,197,71,.15);color:var(--ac)}.tlbadge.other{background:rgba(167,169,190,.15);color:var(--mu)}
.tlnm{font-size:.88rem;font-weight:600;flex:1}
.tlpast{font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:8px;background:rgba(167,169,190,.15);color:var(--mu);flex-shrink:0}
.tlpast.done{background:rgba(100,223,223,.15);color:var(--ac3)}
.tlarr{font-size:.68rem;color:var(--mu);cursor:pointer;flex-shrink:0}
.tldb{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tldb:hover{border-color:var(--ac3)}.tldb.ck{background:var(--ac3);border-color:var(--ac3)}
.tledit{background:var(--sf2);border:1px solid var(--bd);color:var(--mu);cursor:pointer;font-size:.68rem;padding:2px 7px;border-radius:6px;flex-shrink:0;font-family:'Noto Sans KR',sans-serif}
.tledit:hover{border-color:var(--ac);color:var(--ac)}
.tldel{background:none;border:none;color:var(--mu);cursor:pointer;font-size:.82rem;padding:2px 5px;flex-shrink:0}
.tldel:hover{color:var(--ac2)}
.tlnb{padding:8px 12px 10px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.tlnl{display:flex;align-items:flex-start;gap:7px;font-size:.78rem;color:var(--mu);line-height:1.6}
.tlnl.hl{color:var(--ac3)}.tlnd{width:4px;height:4px;border-radius:50%;background:var(--mu);flex-shrink:0;margin-top:7px}
.tlnl.hl .tlnd{background:var(--ac3)}
.aef{background:var(--sf);border-radius:var(--r);padding:14px;border:1px dashed var(--bd);margin-top:8px}
.fr{display:flex;gap:8px;flex-wrap:wrap}.fg{flex:1;min-width:110px}
.fg label{display:block;font-size:.73rem;color:var(--mu);margin-bottom:3px}
.fi,.fs{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;color:var(--tx);font-size:.82rem;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .15s}
.fi:focus,.fs:focus{border-color:var(--ac)}.fs option{background:var(--sf2)}
textarea.fi{resize:vertical;line-height:1.6}
.cchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cchip{background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:4px 12px;font-size:.76rem;cursor:pointer;color:var(--mu);transition:all .15s}
.cchip.active{background:var(--ac);border-color:var(--ac);color:#000;font-weight:700}
.csec{margin-bottom:18px}.csect{font-size:.72rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.ci{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:8px;padding:10px 12px;margin-bottom:5px}
.ci.done{opacity:.45}.ci.done .clbl{text-decoration:line-through}
.cck{width:19px;height:19px;border-radius:5px;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.cck.ck{background:var(--ac);border-color:var(--ac)}.clbl{flex:1;font-size:.86rem}
.acr{display:flex;gap:7px;margin-top:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pc{background:var(--sf);border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;transition:transform .2s,border-color .2s}
.pc:hover{transform:translateY(-3px);border-color:var(--ac3)}
.pch{background:linear-gradient(135deg,#1a1a35,#0f2340);padding:16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.pav{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--ac3),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#000;flex-shrink:0}
.pen{font-size:.95rem;font-weight:700;letter-spacing:.5px;font-family:monospace}.pko{font-size:.78rem;color:var(--mu);margin-top:1px}
.pb{padding:14px}.pf{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.pfi{font-size:.9rem;width:18px;text-align:center;flex-shrink:0;margin-top:1px}
.pfl{font-size:.7rem;color:var(--mu);margin-bottom:1px}.pfv{font-size:.84rem;font-weight:500}
.pfv.mono{font-family:monospace;letter-spacing:1.5px;color:var(--ac3)}.pfv.pass{font-family:monospace;letter-spacing:2px;color:var(--ac)}
.pfv.nof{color:var(--mu);font-style:italic;font-size:.8rem}.pft{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:7px}
.bsec{margin-bottom:22px}
.bst{font-size:.74rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.bst::after{content:'';flex:1;height:1px;background:var(--bd)}
.btbl{width:100%;border-collapse:collapse}
.btbl th{font-size:.7rem;color:var(--mu);text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);font-weight:500}
.btbl th:last-child,.btbl td:last-child{text-align:right}
.btbl th:nth-child(3),.btbl td:nth-child(3){text-align:right}
.btbl td{font-size:.79rem;padding:8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.btbl tr:hover td{background:rgba(255,255,255,.02)}
.btbl td.nt{color:var(--mu);font-size:.73rem}.btbl td.wn{color:var(--ac3);font-family:monospace;white-space:nowrap}.btbl td.qt{color:var(--mu);text-align:right}
.bsub td{background:var(--sf2);font-weight:700;font-size:.78rem;border-top:1px solid var(--bd)}.bsub td.wn{color:var(--ac)}
.btag{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:9px;margin-left:5px;font-weight:600}
.btag.tp{background:rgba(100,223,223,.15);color:var(--ac3)}.btag.tm{background:rgba(232,197,71,.15);color:var(--ac)}
.btag.tf{background:rgba(249,115,22,.15);color:#f97316}.btag.tms{background:rgba(167,139,250,.15);color:#a78bfa}
.btag.tg{background:rgba(255,107,107,.15);color:var(--ac2)}.btag.tt{background:rgba(34,211,238,.15);color:#22d3ee}
.bgrand{background:linear-gradient(135deg,var(--sf),var(--sf2));border-radius:var(--r);padding:18px 22px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--bd)}
.bgl{font-size:.87rem;color:var(--mu)}.bga{font-size:1.5rem;font-weight:700;color:var(--ac);font-family:monospace}
.bgv{font-size:.8rem;color:var(--mu);margin-top:2px;text-align:right}
.btnp{background:var(--ac);color:#000;border:none;cursor:pointer;padding:8px 18px;border-radius:22px;font-size:.82rem;font-weight:700;font-family:'Noto Sans KR',sans-serif;transition:transform .15s,box-shadow .15s}
.btnp:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(232,197,71,.3)}
.btna{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.8rem;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.btna:hover{border-color:var(--ac);color:var(--ac)}
.btns{flex:1;padding:6px;border-radius:7px;border:1px solid var(--bd);background:none;color:var(--mu);cursor:pointer;font-size:.78rem;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.btns:hover{background:var(--sf2);color:var(--tx)}
.btnc{background:none;border:1px solid var(--bd);color:var(--mu);padding:8px 18px;border-radius:22px;cursor:pointer;font-size:.82rem;font-family:'Noto Sans KR',sans-serif}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.open{opacity:1;pointer-events:all}
.md{background:var(--sf);border-radius:18px;padding:24px;width:min(500px,93vw);border:1px solid var(--bd);transform:scale(.95);transition:transform .2s}
.mo.open .md{transform:scale(1)}
.mt{font-size:1.1rem;font-weight:700;margin-bottom:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.st{font-size:1.2rem;font-weight:700}
@media(max-width:550px){.srow{grid-template-columns:repeat(3,1fr)}.pgrid{grid-template-columns:1fr}.fr{flex-direction:column}}

.emoji-opt{font-size:1.6rem;cursor:pointer;padding:4px;border-radius:8px;border:2px solid transparent;transition:all .15s;line-height:1}
.emoji-opt:hover{background:var(--sf2)}
.emoji-opt.active{border-color:var(--ac);background:var(--sf2)}
</style>
</head>
<body>
<header>
  <div class="logo">Trip<span>Guide</span></div>
  <nav class="tnav">
    <button class="tbtn active" id="btn-home" onclick="gotoPage('home')">&#9992; 여행</button>
    <button class="tbtn" id="btn-detail" style="display:none" onclick="gotoPage('detail')">&#128203; 상세</button>
  </nav>
</header>
<div class="app">
  <div class="page active" id="page-home">
    <div class="sh"><div class="st">나의 해외 여행 &#9992;&#65039;</div><button class="btnp" onclick="openAddTrip()">+ 새 여행 추가</button></div>
    <div id="home-c"></div>
  </div>
  <div class="page" id="page-detail">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button id="back-btn" style="background:var(--sf2);border:none;color:var(--tx);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.95rem">&larr;</button>
      <div><div id="dtitle" style="font-size:1.4rem;font-weight:700"></div><div id="dsub" style="font-size:.82rem;color:var(--mu);margin-top:2px"></div></div>
    </div>
    <div class="srow" id="dstats"></div>
    <div class="itabs">
      <button class="itab active" onclick="switchTab('schedule',this)">&#128197; 일정</button>
      <button class="itab" onclick="switchTab('checklist',this)">&#9745; 체크리스트</button>
      <button class="itab" onclick="switchTab('passengers',this)">&#128706; 탑승자</button>
      <button class="itab" onclick="switchTab('reservations',this)">&#128222; 예약리스트</button>
      <button class="itab" onclick="switchTab('budget',this)">&#128176; 예산</button>
    </div>
    <div id="panel-schedule"></div>
    <div id="panel-checklist" style="display:none"></div>
    <div id="panel-passengers" style="display:none"></div>
    <div id="panel-reservations" style="display:none"></div>
    <div id="panel-budget" style="display:none"></div>
  </div>
</div>
<!-- Edit Event Modal -->
<div class="mo" id="mo-ev">
  <div class="md">
    <div class="mt" id="mo-ev-t">일정 수정</div>
    <div class="fr">
      <div class="fg"><label>시간</label><input class="fi" type="time" id="ee-time"></div>
      <div class="fg"><label>종류</label>
        <select class="fs" id="ee-type">
          <option value="activity">관광</option><option value="food">식사</option>
          <option value="transport">교통</option><option value="hotel">숙소</option><option value="other">기타</option>
        </select>
      </div>
    </div>
    <div class="fg" style="margin-top:10px"><label>일정 이름</label><input class="fi" id="ee-name"></div>
    <div class="fg" style="margin-top:10px">
      <label>메모 <span style="font-size:.72rem;color:var(--mu)">(줄바꿈 또는 &middot; 구분)</span></label>
      <textarea class="fi" id="ee-note" rows="4"></textarea>
    </div>
    <input type="hidden" id="ee-day"><input type="hidden" id="ee-id">
    <div class="mf"><button class="btnc" onclick="closeMo('mo-ev')">취소</button><button class="btnp" onclick="saveEvModal()">저장</button></div>
  </div>
</div>
<!-- Passenger Modal -->
<div class="mo" id="mo-pax">
  <div class="md">
    <div class="mt" id="mo-pax-t">탑승자 추가</div>
    <div class="fr">
      <div class="fg"><label>영문 성명</label><input class="fi" id="px-en" placeholder="KIM HEEJIN" style="font-family:monospace;text-transform:uppercase"></div>
      <div class="fg"><label>한글 성명</label><input class="fi" id="px-ko" placeholder="김희진"></div>
    </div>
    <div class="fr" style="margin-top:10px">
      <div class="fg"><label>생년월일</label><input class="fi" id="px-birth" placeholder="1990.07.30"></div>
      <div class="fg"><label>여권 번호</label><input class="fi" id="px-pp" placeholder="M878S1645" style="font-family:monospace;text-transform:uppercase"></div>
    </div>
    <div class="fg" style="margin-top:10px"><label>항공사 회원번호</label><input class="fi" id="px-ffn" placeholder="아시아나 818842454"></div>
    <input type="hidden" id="px-id">
    <div class="mf"><button class="btnc" onclick="closeMo('mo-pax')">취소</button><button class="btnp" onclick="savePaxModal()">저장</button></div>
  </div>
</div>


<!-- Add Trip Modal -->
<div class="mo" id="mo-trip">
  <div class="md">
    <div class="mt">새 여행 만들기 ✈️</div>
    <div class="fg"><label>여행 이름</label><input class="fi" id="nt-name" placeholder="예: 방콕 가족여행"></div>
    <div class="fr" style="margin-top:10px">
      <div class="fg"><label>출발일</label><input class="fi" type="date" id="nt-start"></div>
      <div class="fg"><label>귀국일</label><input class="fi" type="date" id="nt-end"></div>
    </div>
    <div class="fg" style="margin-top:10px"><label>이모지</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px" id="nt-emoji-picker">
        <span class="emoji-opt active" onclick="pickEmoji(this)">🏖</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🗼</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🌸</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🏔</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🌴</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🎡</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🏯</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🗽</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🌊</span>
        <span class="emoji-opt" onclick="pickEmoji(this)">🎑</span>
      </div>
    </div>
    <div class="mf"><button class="btnc" onclick="closeMo('mo-trip')">취소</button><button class="btnp" onclick="createTrip()">만들기</button></div>
  </div>
</div>

<script>
// ================================================================
// STATIC DATA — 코드에서만 읽음. localStorage에 내용 없음.
// 깃허브 업데이트 = 폰에서 항상 최신 내용 반영됨.
// ================================================================
var TRIP = {id:'dng25', name:'다낭 가족 여행', emoji:'🏖', start:'2025-05-15', end:'2025-05-19'};

var PAX_DEF = [
  {id:'p1', en:'KIM HEEJIN',  ko:'김희진', birth:'1990.07.30', pass:'M878S1645',  ffn:'아시아나 항공 818842454'},
  {id:'p2', en:'LEE SUNGMIN', ko:'이성민', birth:'1986.03.26', pass:'M37244299',  ffn:''},

function gotoPage(p) {
  document.querySelectorAll('.page').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('page-' + p).classList.add('active');
  document.querySelectorAll('.tbtn').forEach(function(b) { b.classList.remove('active'); });
  if (p === 'home') {
    document.getElementById('btn-home').classList.add('active');
    document.getElementById('btn-detail').style.display = 'none';
    renderHome();
  } else {
    document.getElementById('btn-detail').style.display = '';
    document.getElementById('btn-detail').classList.add('active');
    renderDetail();
  }
}

document.getElementById('back-btn').onclick = function() { gotoPage('home'); };

      + '</div>';

}

function rSchedExtra(sched) {
  var days = Object.keys(sched);
  if (!days.includes(_aday2)) _aday2 = days[0];
  var now = new Date();
  var panel = document.getElementById('panel-schedule');
  panel.innerHTML = '';

  // Day tab bar
  var dtbar = document.createElement('div');

  days.forEach(function(d, i) {
    var cnt = sched[d].length, dow = DOW[new Date(d).getDay()];

    btn.className = 'dt' + (d === _aday2 ? ' active' : '');
    btn.innerHTML = '<span class="dt-n">Day ' + (i+1) + '</span><span class="dt-d">' + dow + '</span>'
      + (cnt ? '<span class="dt-c">' + cnt + '</span>' : '');
    btn.addEventListener('click', (function(day) { return function() { _aday2 = day; rSchedExtra(sched); }; })(d));
    dtbar.appendChild(btn);
  });
  panel.appendChild(dtbar);

  var d = _aday2, dow = DOW[new Date(d).getDay()];
  var evs = (sched[d]||[]).slice().sort(function(a,b){return a.t.localeCompare(b.t);});

  var dh = document.createElement('div');
  dh.className = 'dh';
  dh.innerHTML = '<span class="dbadge">' + d + '</span><span class="ddow">' + dow + '요일</span>';
  panel.appendChild(dh);

  var tl = document.createElement('div');
  tl.className = 'tl';
  evs.forEach(function(ev) {
    var chips = ev.m ? ev.m.split('·').map(function(c){return c.trim();}).filter(Boolean) : [];
    var has = chips.length > 0;
    var done = !!_ed2[ev.id], exp = !!_xp2[ev.id];
    var past = new Date(d+'T'+ev.t+':00') < now;
    var show = has && (!past || exp);

    var item = document.createElement('div');
    item.className = 'tli';
    var dot = document.createElement('div');
    dot.className = 'tldot ' + ev.y;
    item.appendChild(dot);

    var card = document.createElement('div');
    card.className = 'tlc' + (done?' done':'') + (past&&!done?' past':'');

    var head = document.createElement('div');
    head.className = 'tlch';
    if (past && has) { head.style.cursor='pointer'; head.addEventListener('click', (function(id){return function(){_xp2[id]=!_xp2[id];rSchedExtra(sched);};})(ev.id)); }

    var db = document.createElement('button');
    db.className = 'tldb' + (done?' ck':'');
    db.innerHTML = done ? '<svg width="11" height="11" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#000" stroke-width="2" fill="none"/></svg>' : '';
    db.addEventListener('click', (function(id){return function(e){e.stopPropagation();_ed2[id]=!_ed2[id];if(!_ed2[id])delete _ed2[id];localStorage.setItem('tg_ed2',JSON.stringify(_ed2));rSchedExtra(sched);};})(ev.id));

    var timeEl = document.createElement('span'); timeEl.className='tltime'; timeEl.textContent=ev.t||'--:--';
    var badge = document.createElement('span'); badge.className='tlbadge '+ev.y; badge.textContent=TL[ev.y||'other'];
    var nameEl = document.createElement('span'); nameEl.className='tlnm'; nameEl.textContent=ev.n;

    head.appendChild(db); head.appendChild(timeEl); head.appendChild(badge); head.appendChild(nameEl);
    if (past) { var pb=document.createElement('span'); pb.className='tlpast'+(done?' done':''); pb.textContent=done?'완료':'지남'; head.appendChild(pb); }
    if (past&&has) { var arr=document.createElement('span'); arr.className='tlarr'; arr.textContent=exp?'▴':'▾'; head.appendChild(arr); }
    card.appendChild(head);

    if (show) {
      var nb = document.createElement('div'); nb.className='tlnb';
      chips.forEach(function(c) {
        var hl = c.indexOf('무료')>=0||c.indexOf('예약')>=0||c.indexOf('완료')>=0||c.indexOf('⚠️')>=0;
        var nl = document.createElement('div'); nl.className='tlnl'+(hl?' hl':'');

// ── Schedule ───────────────────────────────────────────────────
var TL  = {transport:'교통', food:'식사', hotel:'숙소', activity:'관광', other:'기타'};
var DOW = ['일','월','화','수','목','금','토'];

function rSched() {
  var days = Object.keys(SCHED);
  if (!days.includes(_aday)) _aday = days[0];
  var now  = new Date();
  var panel = document.getElementById('panel-schedule');
  panel.innerHTML = '';

  // Day tab bar
  var dtbar = document.createElement('div');
  dtbar.className = 'dtbar';
  days.forEach(function(d, i) {
    var cnt = SCHED[d].length, dow = DOW[new Date(d).getDay()];
    var btn = document.createElement('button');
    btn.className = 'dt' + (d === _aday ? ' active' : '');
    btn.innerHTML = '<span class="dt-n">Day ' + (i+1) + '</span><span class="dt-d">' + dow + '</span>'
      + (cnt ? '<span class="dt-c">' + cnt + '</span>' : '');
    btn.addEventListener('click', (function(day) { return function() { setDay(day); }; })(d));
    dtbar.appendChild(btn);
  });
  panel.appendChild(dtbar);

  var d   = _aday;
  var dow = DOW[new Date(d).getDay()];
  var evs = SCHED[d].slice().sort(function(a, b) { return a.t.localeCompare(b.t); });

  // Day header
  var dh = document.createElement('div');
  dh.className = 'dh';
  dh.innerHTML = '<span class="dbadge">' + d + '</span><span class="ddow">' + dow + '요일</span>';
  var addBtn = document.createElement('button');
  addBtn.className = 'btna';
  addBtn.style.cssText = 'margin:0;padding:4px 11px;font-size:.74rem;margin-left:auto';
  addBtn.textContent = '+ 추가';
  addBtn.addEventListener('click', function() { showAef(d); });
  dh.appendChild(addBtn);
  panel.appendChild(dh);

  // Timeline
  var tl = document.createElement('div');
  tl.className = 'tl';
  if (evs.length) {
    evs.forEach(function(ev) {
      var chips = ev.m ? ev.m.split('·').map(function(c) { return c.trim(); }).filter(Boolean) : [];
      var has   = chips.length > 0;
      var edt   = new Date(d + 'T' + ev.t + ':00');
      var past  = edt < now, done = !!_ed[ev.id], exp = !!_xp[ev.id];
      var show  = has && (!past || exp);

      var item = document.createElement('div');
      item.className = 'tli';

      var dot = document.createElement('div');
      dot.className = 'tldot ' + ev.y;
      item.appendChild(dot);

      var card = document.createElement('div');
      card.className = 'tlc' + (done ? ' done' : '') + (past && !done ? ' past' : '');

      // Card head
      var head = document.createElement('div');
      head.className = 'tlch';
      if (past && has) { head.addEventListener('click', (function(id) { return function() { xp(id); }; })(ev.id)); head.style.cursor = 'pointer'; }

      var doneBtn = document.createElement('button');
      doneBtn.className = 'tldb' + (done ? ' ck' : '');
      doneBtn.innerHTML = done ? '<svg width="11" height="11" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#000" stroke-width="2" fill="none"/></svg>' : '';
      doneBtn.addEventListener('click', (function(id) { return function(e) { e.stopPropagation(); tgDone(id); }; })(ev.id));

      var timeEl = document.createElement('span');
      timeEl.className = 'tltime';
      timeEl.textContent = ev.t || '--:--';

      var badge = document.createElement('span');
      badge.className = 'tlbadge ' + ev.y;
      badge.textContent = TL[ev.y || 'other'];

      var nameEl = document.createElement('span');
      nameEl.className = 'tlnm';
      nameEl.textContent = ev.n;

      head.appendChild(doneBtn);
      head.appendChild(timeEl);
      head.appendChild(badge);
      head.appendChild(nameEl);

      if (past) {
        var pastBadge = document.createElement('span');
        pastBadge.className = 'tlpast' + (done ? ' done' : '');
        pastBadge.textContent = done ? '완료' : '지남';
        head.appendChild(pastBadge);
      }
      if (past && has) {
        var arr = document.createElement('span');
        arr.className = 'tlarr';
        arr.textContent = exp ? '▴' : '▾';
        head.appendChild(arr);
      }

      var editBtn = document.createElement('button');
      editBtn.className = 'tledit';
      editBtn.textContent = '수정';
      editBtn.addEventListener('click', (function(day, id) { return function(e) { e.stopPropagation(); openEv(day, id); }; })(d, ev.id));

      var delBtn = document.createElement('button');
      delBtn.className = 'tldel';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', (function(day, id) { return function(e) { e.stopPropagation(); delEv(day, id); }; })(d, ev.id));

      head.appendChild(editBtn);
      head.appendChild(delBtn);
      card.appendChild(head);

      // Note body
      if (show) {
        var nb = document.createElement('div');
        nb.className = 'tlnb';
        chips.forEach(function(c) {
          var hl = c.indexOf('무료') >= 0 || c.indexOf('예약') >= 0 || c.indexOf('완료') >= 0 || c.indexOf('✅') >= 0;
          var nl = document.createElement('div');
          nl.className = 'tlnl' + (hl ? ' hl' : '');
          var nd = document.createElement('span');
          nd.className = 'tlnd';
          nl.appendChild(nd);
          nl.appendChild(document.createTextNode(c));
          nb.appendChild(nl);
        });
        card.appendChild(nb);
      }

      item.appendChild(card);
      tl.appendChild(item);
    });
  } else {
    tl.innerHTML = '<div style="padding:28px;text-align:center;color:var(--mu);font-size:.85rem">이 날 일정이 없어요</div>';
  }
  panel.appendChild(tl);

  // Add event form
  var aef = document.createElement('div');
  aef.className = 'aef';
  aef.id = 'aef-' + d;
  aef.style.display = 'none';
  aef.style.marginTop = '8px';
  aef.innerHTML = '<div class="fr">'
    + '<div class="fg"><label>시간</label><input class="fi" type="time" id="eft-' + d + '" value="09:00"></div>'
    + '<div class="fg"><label>종류</label><select class="fs" id="efy-' + d + '">'
    + '<option value="activity">관광</option><option value="food">식사</option>'
    + '<option value="transport">교통</option><option value="hotel">숙소</option><option value="other">기타</option>'
    + '</select></div></div>'
    + '<div class="fr" style="margin-top:7px">'
    + '<div class="fg"><label>일정 이름 *</label><input class="fi" id="efn-' + d + '" placeholder="예: 한시장 마사지"></div>'
    + '<div class="fg"><label>메모 (· 구분)</label><input class="fi" id="efm-' + d + '" placeholder="예: 예약번호 123 · 무료"></div>'
    + '</div>';
  var aefBtns = document.createElement('div');
  aefBtns.style.cssText = 'display:flex;gap:7px;margin-top:7px';
  var saveAef = document.createElement('button');
  saveAef.className = 'btna';
  saveAef.textContent = '저장';
  saveAef.addEventListener('click', function() { addEv(d); });
  var cancelAef = document.createElement('button');
  cancelAef.className = 'btnc';
  cancelAef.style.cssText = 'padding:7px 12px;border-radius:7px;cursor:pointer';
  cancelAef.textContent = '취소';
  cancelAef.addEventListener('click', function() { aef.style.display = 'none'; });
  aefBtns.appendChild(saveAef);
  aefBtns.appendChild(cancelAef);
  aef.appendChild(aefBtns);
  panel.appendChild(aef);
}

function setDay(d) { _aday = d; rSched(); }
function showAef(d) { var el = document.getElementById('aef-' + d); if (el) el.style.display = 'block'; }
function xp(id) { _xp[id] = !_xp[id]; rSched(); }
function tgDone(id) { _ed[id] = !_ed[id]; if (!_ed[id]) delete _ed[id]; ss(); rSched(); }

function addEv(d) {
  var n = document.getElementById('efn-' + d).value.trim();
  if (!n) { alert('일정 이름을 입력해주세요.'); return; }
  var ev = {
    id: 'u_' + Date.now(),
    t: document.getElementById('eft-' + d).value,
    y: document.getElementById('efy-' + d).value,
    n: n,
    m: document.getElementById('efm-' + d).value.trim()
  };
  if (!SCHED[d]) SCHED[d] = [];
  SCHED[d].push(ev);
  if (!_uev[d]) _uev[d] = [];
  _uev[d].push(ev);
  suev(); rSched();
}

function delEv(d, id) {
  if (!confirm('삭제할까요?')) return;
  SCHED[d] = (SCHED[d] || []).filter(function(e) { return e.id !== id; });
  if (_uev[d]) _uev[d] = _uev[d].filter(function(e) { return e.id !== id; });
  suev(); rSched();
}

function openEv(d, id) {
  var ev = (SCHED[d] || []).find(function(e) { return e.id === id; });
  if (!ev) return;
  _eEvDay = d; _eEvId = id;
  document.getElementById('mo-ev-t').textContent = '일정 수정 ✏️';
  document.getElementById('ee-time').value = ev.t || '';
  document.getElementById('ee-type').value = ev.y || 'activity';
  document.getElementById('ee-name').value = ev.n || '';
  document.getElementById('ee-note').value = (ev.m || '').split('·').map(function(s) { return s.trim(); }).filter(Boolean).join('\n');
  document.getElementById('mo-ev').classList.add('open');
}

function saveEvModal() {
  var d = _eEvDay, id = _eEvId;
  var ev = (SCHED[d] || []).find(function(e) { return e.id === id; });
  if (!ev) return;
  ev.t = document.getElementById('ee-time').value;
  ev.y = document.getElementById('ee-type').value;
  ev.n = document.getElementById('ee-name').value.trim();
  ev.m = document.getElementById('ee-note').value.split('\n').map(function(s) { return s.replace(/^[· ]+/, '').trim(); }).filter(Boolean).join(' · ');
  if (_uev[d]) {
    var ue = _uev[d].find(function(e) { return e.id === id; });
    if (ue) { ue.t = ev.t; ue.y = ev.y; ue.n = ev.n; ue.m = ev.m; }
  }
  suev(); closeMo('mo-ev'); rSched();
}

// ── Checklist ──────────────────────────────────────────────────
function rCL() {
  var cats = ['전체'].concat(Object.keys(CL));
  var h = '<div class="cchips">' + cats.map(function(c) {
    return '<span class="cchip' + (c === _acat ? ' active' : '') + '" onclick="setCat(\'' + c + '\')">' + c + '</span>';
  }).join('') + '</div>';
  var show = _acat === '전체' ? Object.keys(CL) : [_acat];
  show.forEach(function(cat) {
    var items = CL[cat] || [];
    h += '<div class="csec"><div class="csect">' + cat + '</div>';
    items.forEach(function(text) {
      var k = TRIP.id + '_' + text, done = !!_ck[k];
      h += '<div class="ci' + (done ? ' done' : '') + '">'
        + '<div class="cck' + (done ? ' ck' : '') + '" onclick="tgCk(\'' + k + '\')">'
        + (done ? '<svg width="10" height="10" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#000" stroke-width="2" fill="none"/></svg>' : '')
        + '</div><span class="clbl">' + text + '</span></div>';
    });
    h += '</div>';
  });
  h += '<div class="acr"><input class="fi" id="cl-in" placeholder="새 항목 입력..." onkeydown="if(event.key===\'Enter\')addCL()"><button class="btna" onclick="addCL()">추가</button></div>';
  document.getElementById('panel-checklist').innerHTML = h;
}

function setCat(c) { _acat = c; rCL(); }

function tgCk(k) { _ck[k] = !_ck[k]; if (!_ck[k]) delete _ck[k]; ss(); rCL(); renderDetail(); }

function addCL() {
  var inp = document.getElementById('cl-in'), text = inp.value.trim();
  if (!text) return;
  var cat = _acat === '전체' ? Object.keys(CL)[0] : _acat;
  if (!CL[cat]) CL[cat] = [];
  CL[cat].push(text);
  if (!_ucl[cat]) _ucl[cat] = [];
  _ucl[cat].push(text);
  sucl(); inp.value = ''; rCL();
}

    en: en,
    ko: document.getElementById('px-ko').value.trim(),
    birth: document.getElementById('px-birth').value.trim(),
    pass: document.getElementById('px-pp').value.trim().toUpperCase(),
    ffn: document.getElementById('px-ffn').value.trim()
  };
  if (_ePaxId) {
    var idx = _pax.findIndex(function(p) { return p.id === _ePaxId; });
    if (idx >= 0) _pax[idx] = Object.assign({}, _pax[idx], data);
  } else {
    _pax.push(Object.assign({id: 'p' + Date.now()}, data));
  }
  spax(); closeMo('mo-pax'); rPax();
}

function delPax(id) {
  if (!confirm('삭제할까요?')) return;
  _pax = _pax.filter(function(p) { return p.id !== id; });
  spax(); rPax();
}

function rReservations() {
  var doneCount = RESERVATIONS.filter(function(r){return r.status==='done';}).length;
  var todoCount = RESERVATIONS.filter(function(r){return r.status!=='done';}).length;
  var h = '<div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">'
    + '<div style="background:rgba(100,223,223,.1);border:1px solid rgba(100,223,223,.3);border-radius:10px;padding:12px 20px;flex:1;min-width:120px">'
    + '<div style="font-size:.72rem;color:var(--mu);margin-bottom:4px">예약 완료</div>'
    + '<div style="font-size:1.6rem;font-weight:700;color:var(--ac3)">' + doneCount + '<span style="font-size:.9rem;font-weight:400">건</span></div></div>'
    + '<div style="background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:10px;padding:12px 20px;flex:1;min-width:120px">'
    + '<div style="font-size:.72rem;color:var(--mu);margin-bottom:4px">예약 필요</div>'
    + '<div style="font-size:1.6rem;font-weight:700;color:var(--ac2)">' + todoCount + '<span style="font-size:.9rem;font-weight:400">건</span></div></div>'
    + '</div>';
  RESERVATIONS.forEach(function(r) {
    var isDone = r.status === 'done';
    var isUrgent = r.status === 'urgent';
    var bdColor = isDone ? 'var(--ac3)' : isUrgent ? '#f97316' : 'var(--ac2)';
    var bdBg = isDone ? 'rgba(100,223,223,.12)' : isUrgent ? 'rgba(249,115,22,.12)' : 'rgba(255,107,107,.12)';
    var borderStyle = isUrgent ? ';border-color:rgba(249,115,22,.5)' : isDone ? ';border-color:rgba(100,223,223,.3)' : '';
    h += '<div style="background:var(--sf);border-radius:12px;border:1px solid var(--bd);margin-bottom:10px;overflow:hidden' + (isDone?';opacity:.7':'') + borderStyle + '">'
      + '<div style="display:flex;align-items:center;gap:10px;padding:13px 15px">'
      + '<span style="font-size:1.4rem;flex-shrink:0">' + r.icon + '</span>'
      + '<div style="flex:1">'
      + '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
      + '<span style="font-size:.9rem;font-weight:700">' + r.title + '</span>'
      + '<span style="font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:8px;background:' + bdBg + ';color:' + bdColor + '">' + r.badge + '</span>'
      + (isDone ? '<span style="font-size:.72rem;color:var(--ac3)">✓</span>' : '')
      + '</div>'
      + '<div style="font-size:.78rem;color:' + (isUrgent?'#f97316':'var(--ac)') + ';margin-top:3px;font-weight:600">📅 ' + r.day + '</div>'
      + '</div></div>'
      + '<div style="border-top:1px solid var(--bd);padding:10px 15px;display:flex;flex-direction:column;gap:5px">'
      + r.items.map(function(item) {
          var hl = item.indexOf('⚠️') >= 0;
          return '<div style="display:flex;align-items:flex-start;gap:7px;font-size:.79rem;color:' + (hl?'#f97316':'var(--mu)') + ';line-height:1.6">'
            + '<span style="width:4px;height:4px;border-radius:50%;background:' + (hl?'#f97316':'var(--mu)') + ';flex-shrink:0;margin-top:8px"></span>'
            + item + '</div>';
        }).join('')
      + '</div></div>';
  });
  document.getElementById('panel-reservations').innerHTML = h;
}

// ── Budget ─────────────────────────────────────────────────────
function rBudget() {
  var gv = 0, gk = 0;
  BUDGET.forEach(function(s) { s.items.forEach(function(it) { gv += it.q * it.uv; gk += it.q * it.uk; }); });
  var h = '<div class="bgrand" style="margin-bottom:22px">'
    + '<div><div class="bgl">💳 총 예상 지출</div><div class="bgv">' + gv.toLocaleString() + ' VND</div></div>'
    + '<div style="text-align:right"><div class="bga">₩' + gk.toLocaleString() + '</div></div></div>';
  BUDGET.forEach(function(sec) {
    var sk = sec.items.reduce(function(a, it) { return a + it.q * it.uk; }, 0);
    h += '<div class="bsec"><div class="bst">' + sec.icon + ' ' + sec.cat
      + ' <span class="btag ' + sec.tc + '">' + sec.tc.slice(1) + '</span></div>'
      + '<table class="btbl"><thead><tr><th>항목</th><th>설명</th><th>수량</th><th>단가(₩)</th><th>합계(₩)</th></tr></thead><tbody>';
    sec.items.forEach(function(it) {
      h += '<tr><td>' + it.n + '</td><td class="nt">' + (it.d||'—') + '</td><td class="qt">' + it.q + '</td>'
        + '<td class="wn">' + (it.uk ? '₩' + it.uk.toLocaleString() : '—') + '</td>'
        + '<td class="wn" style="font-weight:600">' + (it.uk ? '₩' + (it.q*it.uk).toLocaleString() : '—') + '</td></tr>';
    });
    h += '<tr class="bsub"><td colspan="4">소계' + (sec.note ? ' <span style="font-size:.72rem;color:var(--mu)">(' + sec.note + ')</span>' : '') + '</td>'
      + '<td class="wn">₩' + sk.toLocaleString() + '</td></tr></tbody></table></div>';
  });
  h += '<div class="bgrand"><div><div class="bgl">💳 총 합계</div><div class="bgv">' + gv.toLocaleString() + ' VND</div></div>'
    + '<div style="text-align:right"><div class="bga">₩' + gk.toLocaleString() + '</div></div></div>';
  document.getElementById('panel-budget').innerHTML = h;
}
